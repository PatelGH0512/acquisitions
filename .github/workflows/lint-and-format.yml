name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        id: eslint
        run: npm run lint

      - name: Prettier (check)
        id: prettier
        run: npm run format:check

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lint & Format"
            echo ""
            echo "- ESLint: ${{ steps.eslint.outcome }}"
            echo "- Prettier: ${{ steps.prettier.outcome }}"
            echo ""
            echo "### Fix locally"
            echo "- npm run lint:fix"
            echo "- npm run format"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate failure hints
        if: failure()
        run: |
          echo "::error title=Lint/Format checks failed::Run 'npm run lint:fix' and/or 'npm run format' locally, then commit the changes."
