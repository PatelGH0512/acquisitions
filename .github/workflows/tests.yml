name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo ""
            echo "- npm test: ${{ steps.tests.outcome }}"
            echo ""
            if [ -f coverage/lcov.info ]; then
              echo "Coverage report generated: coverage/lcov-report/index.html (uploaded as artifact)"
            else
              echo "Coverage report not found. Expected 'coverage/' output from Jest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate failures
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error title=Tests failed::npm test failed. See the workflow logs and/or downloaded coverage artifact for details."
          fi

      - name: Fail if tests failed
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            exit 1
          fi
