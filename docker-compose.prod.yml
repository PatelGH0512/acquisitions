services:
  app:
    image: acquisitions-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      ARCJET_KEY: ${ARCJET_KEY}
    ports:
      - '3000:3000'
